<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runaway Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h2>Runaway Login</h2>
        <div class="card">
            <h3>تسجيل الدخول</h3>
            <p class="subtitle">مرحباً بك مجدداً. هناك حقلان فقط يفصلانك عن هذا الزر!</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@domain.com" required>
                    <span class="icon valid-icon">✓</span>
                </div>
                
                <div class="input-group">
                    <div class="label-wrapper">
                        <label for="password">كلمة المرور</label>
                        <a href="#" class="forgot-link">نسيت؟</a>
                    </div>
                    <input type="password" id="password" placeholder="8 أحرف على الأقل" required>
                    <span class="icon toggle-password">👁️</span>
                </div>

                <div class="btn-wrapper">
                    <button type="submit" id="loginBtn">Log In</button>
                </div>
            </form>
            
            <p class="footer-text">ليس لديك حساب؟ <a href="#">أنشئ حساباً</a></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
